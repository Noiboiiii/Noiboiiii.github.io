<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Worker Connection</title>
</head>
<body>
    <h1>Worker Connection</h1>
    <div id="output">Loading data from Worker...</div>

    <script>
        const workerUrl = "https://workernamedomainnameworkersdev.aaron2011175.workers.dev/";
        const output = document.getElementById("output");

        fetch(workerUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Worker returned HTTP ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                output.textContent = data;
            })
            .catch(error => {
                output.textContent = `Error loading Worker data: ${error.message}`;
            });
    </script>
</body>
</html>
